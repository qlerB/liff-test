<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LIFF Test</title>
</head>

<body>

    <h1>LIFF Test</h1>

    <div id="profile"></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>

        async function main() {

            await liff.init({
                liffId: "2011217255-PUqd4FGU"
            });

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();

            const idToken = liff.getIDToken();

            const meResponse = await fetch(
                "https://liff-test-mu.vercel.app/api/me",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        idToken: idToken
                    })
                }
            );
            
            const meResult = await meResponse.json();
            
            console.log("ME:", meResult);

            const response = await fetch("https://liff-test-mu.vercel.app/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idToken: idToken
                })
            });

            const result = await response.json();
                    
            if (!response.ok || !result.success) {
                throw new Error(result.message || "Login failed");
            }
            
            console.log("User saved:", result.user);

            document.getElementById("profile").innerHTML = `
                <h2>สวัสดี ${profile.displayName}</h2>
                <img src="${profile.pictureUrl}" width="100">
            `;
        }

        main();

    </script>

</body>
</html>
